<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PTPT Boost X8 — BLOX Gank</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;600&family=Playfair+Display:wght@700;900&display=swap');

  :root{
    --sky-top:#f3c6e6;
    --sky-mid:#e2c3f1;
    --sky-low:#fdf1f7;
    --sea-deep:#c47ad1;
    --sea-mid:#e2a8de;
    --sea-light:#f6d3ef;
    --ink:#7a2a5c;
    --accent:#ff8fb0;
    --accent-deep:#ff5c8a;
    --cloud:#ffffff;
  }

  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:'Quicksand', sans-serif;
    background:linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 40%, var(--sky-low) 100%);
    color:var(--ink);
    overflow-x:hidden;
  }

  .stage{
    position:relative;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-start;
    padding:48px 20px 0;
    overflow:hidden;
  }

  .cloud{
    position:absolute;
    background:var(--cloud);
    border-radius:100px;
    opacity:0.85;
    filter:drop-shadow(0 4px 0 rgba(63,169,201,0.08));
    animation:driftCloud linear infinite;
  }
  @keyframes driftCloud{
    from{ transform:translateX(-10vw);}
    to{ transform:translateX(110vw);}
  }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--cloud);
    color:var(--accent-deep);
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:15px;
    padding:8px 18px;
    border-radius:999px;
    box-shadow:0 4px 0 rgba(255,122,77,0.18);
    margin-bottom:22px;
    z-index:5;
    letter-spacing:0.5px;
  }
  .badge .dot{
    width:8px; height:8px;
    background:var(--accent);
    border-radius:50%;
    animation:blink 1.4s ease-in-out infinite;
  }
  @keyframes blink{
    0%,100%{opacity:1;}
    50%{opacity:0.25;}
  }

  .title{
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-style:italic;
    font-size:clamp(30px, 6.5vw, 50px);
    line-height:1.2;
    text-align:center;
    margin:0 0 34px;
    color:var(--accent-deep);
    -webkit-text-stroke:2px var(--cloud);
    paint-order:stroke fill;
    text-shadow:0 4px 0 rgba(122,42,92,0.15);
    z-index:5;
  }
  .title .x8{
    display:inline-block;
    font-family:'Baloo 2', sans-serif;
    font-style:normal;
    color:var(--cloud);
    -webkit-text-stroke:0;
    background:linear-gradient(135deg, var(--accent), var(--accent-deep));
    padding:2px 16px;
    border-radius:14px;
    box-shadow:0 5px 0 rgba(255,92,138,0.35);
    transform:rotate(-3deg);
  }

  .subtitle{
    text-align:center;
    font-size:18px;
    max-width:480px;
    color:var(--ink);
    opacity:0.75;
    margin:8px 0 34px;
    z-index:5;
    line-height:1.5;
  }

  .hero-wrap{
    position:relative;
    width:min(88vw, 420px);
    aspect-ratio:1/1;
    z-index:4;
    margin-bottom:8px;
  }

  .hero-frame{
    position:relative;
    width:100%;
    height:100%;
    border-radius:32px;
    overflow:hidden;
    background:linear-gradient(160deg, var(--sea-light), var(--sea-mid));
    box-shadow:0 14px 0 rgba(63,169,201,0.18), 0 20px 40px rgba(63,169,201,0.25);
    border:6px solid var(--cloud);
  }

  #heroImage{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .hero-fallback{
    position:absolute;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
  }
  .hero-fallback svg{ width:78%; height:78%; }

  .cta{
    z-index:5;
    display:inline-flex;
    align-items:center;
    gap:10px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size:20px;
    color:var(--cloud);
    background:linear-gradient(135deg, var(--sea-deep), #a855c9);
    padding:16px 36px;
    border-radius:999px;
    text-decoration:none;
    box-shadow:0 6px 0 #8d3fa8;
    margin:30px 0 10px;
    transition:transform 0.1s ease;
  }
  .cta:active{ transform:translateY(4px); box-shadow:0 2px 0 #8d3fa8; }

  .note{
    z-index:5;
    font-size:14px;
    color:var(--ink);
    opacity:0.55;
    margin-bottom:40px;
    text-align:center;
  }

  .waves{
    position:relative;
    width:100%;
    margin-top:auto;
    line-height:0;
  }
  .waves svg{ width:100%; height:auto; display:block; }

  .bubble{
    position:absolute;
    background:rgba(255,255,255,0.5);
    border-radius:50%;
    animation:rise linear infinite;
  }
  @keyframes rise{
    from{ transform:translateY(0); opacity:0;}
    10%{ opacity:0.7;}
    100%{ transform:translateY(-60vh); opacity:0;}
  }

  .star{
    position:absolute;
    color:var(--cloud);
    opacity:0.9;
    text-shadow:0 0 8px rgba(255,255,255,0.9);
    animation:twinkleStar 2.2s ease-in-out infinite;
  }
  @keyframes twinkleStar{
    0%,100%{ opacity:0.25; transform:scale(0.75);}
    50%{ opacity:1; transform:scale(1.15);}
  }
</style>
</head>
<body>

<div class="stage" id="stage">

  <div class="badge"><span class="dot"></span> BLOX GANK EVENT</div>

  <h1 class="title">Ayo Ikut PTPT<br><span class="x8">BOOST X8</span></h1>

  <div class="hero-wrap">
    <div class="hero-frame">
      <img id="heroImage" src="assets/hero.png" alt="PTPT Boost X8"
           onerror="this.style.display='none'; document.getElementById('heroFallback').style.display='flex';">
      <div class="hero-fallback" id="heroFallback">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <circle cx="100" cy="80" r="46" fill="#ffe3b0"/>
          <path d="M60 95 Q100 60 140 95 Q100 130 60 95 Z" fill="#ff9e6d"/>
          <circle cx="88" cy="88" r="5" fill="#7a2a5c"/>
          <path d="M40 92 L20 78 L20 106 Z" fill="#ff7a4d"/>
          <path d="M20 130 Q60 110 100 130 Q140 150 180 130" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.8"/>
          <path d="M10 150 Q60 130 100 150 Q140 170 190 150" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.5"/>
        </svg>
      </div>
    </div>
  </div>

  <a class="cta" href="https://discord.gg/atn7CuZHa" id="joinBtn" target="_blank" rel="noopener">Gabung Sekarang →</a>

  <div class="waves">
    <svg viewBox="0 0 1440 180" preserveAspectRatio="none">
      <path d="M0,80 C240,140 480,20 720,70 C960,120 1200,40 1440,90 L1440,180 L0,180 Z" fill="#f6d3ef"/>
      <path d="M0,110 C240,160 480,60 720,110 C960,160 1200,80 1440,120 L1440,180 L0,180 Z" fill="#e2a8de"/>
      <path d="M0,140 C240,180 480,100 720,140 C960,180 1200,110 1440,150 L1440,180 L0,180 Z" fill="#c47ad1"/>
    </svg>
  </div>
</div>

<script>
  const stage = document.getElementById('stage');
  const cloudSizes = [
    {w:90,h:34,top:'8%'}, {w:60,h:22,top:'16%'}, {w:110,h:40,top:'4%'},
    {w:50,h:18,top:'22%'}, {w:75,h:28,top:'12%'}
  ];
  cloudSizes.forEach((c,i)=>{
    const el = document.createElement('div');
    el.className='cloud';
    el.style.width=c.w+'px';
    el.style.height=c.h+'px';
    el.style.top=c.top;
    el.style.left='-15vw';
    el.style.animationDuration=(28+i*9)+'s';
    el.style.animationDelay=(i*4)+'s';
    stage.insertBefore(el, stage.firstChild);
  });

  for(let i=0;i<14;i++){
    const b = document.createElement('div');
    b.className='bubble';
    const size = 4+Math.random()*10;
    b.style.width=size+'px';
    b.style.height=size+'px';
    b.style.left=Math.random()*100+'vw';
    b.style.bottom='0';
    b.style.animationDuration=(6+Math.random()*8)+'s';
    b.style.animationDelay=(Math.random()*8)+'s';
    stage.appendChild(b);
  }

  const starSpots = [[6,10],[92,8],[88,28],[10,32],[50,5],[75,18]];
  starSpots.forEach(([x,y],i)=>{
    const s = document.createElement('div');
    s.className='star';
    s.textContent='✦';
    s.style.left=x+'%';
    s.style.top=y+'%';
    s.style.fontSize=(12+Math.random()*10)+'px';
    s.style.animationDelay=(i*0.35)+'s';
    stage.appendChild(s);
  });

</script>

</body>
</html>
